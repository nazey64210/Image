<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vidéo plein écran mobile</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100svh; /* indispensable sur iOS récents */
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;      /* CLÉ : remplit tout l’écran */
      object-position: center;
      display: block;
    }

    a {
      position: absolute;
      inset: 0;
    }
  </style>
</head>

<body>

<a href="https://www.zeyro.eus" rel="noopener noreferrer">
  <div class="video-container">
    <video autoplay loop muted playsinline>
      <source src="Vidéo.mov" type="video/mp4">
    </video>
  </div>
</a>

</body>
</html>
