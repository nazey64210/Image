<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo plein écran</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    .image-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* garde l'image entière sans déformation */
      display: block;
      background: black;
    }
  </style>
</head>

<body>
  <div class="image-wrapper">
    <img src="qqqqq.jpg" alt="Photo" />
  </div>
</body>
</html>
